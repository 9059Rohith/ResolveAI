[project]
name = "hiver-support-agent"
version = "1.0.0"
description = "Auditable single-brand support agent and evaluation workbench"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.52.4", "pydantic==2.13.5",
  "httpx==0.28.1", "PyYAML==6.0.3", "python-dotenv==1.2.3"
]

[project.optional-dependencies]
vector = ["chromadb==1.5.9"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6", "scikit-learn==1.9.0", "numpy==2.5.3"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "api", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
